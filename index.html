    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --accent: #4895ef;
            --light: #f8f9fa;
            --dark: #212529;
            --success: #4cc9f0;
            --warning: #f72585;
            --font: 'Tajawal', sans-serif;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: var(--font);
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--dark);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 1s;
        }
        
        h1 {
            color: var(--secondary);
            font-size: 2.5rem;
            margin-bottom: 15px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }
        
        .subtitle {
            color: var(--accent);
            font-size: 1.2rem;
            font-weight: 500;
        }
        
        /* تصميم بطاقة الاختبار */
        .quiz-card {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            margin-bottom: 30px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        
        .quiz-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: linear-gradient(to bottom, var(--primary), var(--success));
        }
        
        .quiz-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }
        
        /* شريط التقدم */
        .progress-container {
            width: 100%;
            height: 8px;
            background-color: #e9ecef;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(to right, var(--primary), var(--accent));
            border-radius: 10px;
            transition: width 0.4s ease;
        }
        
        /* تصميم الأسئلة */
        .question {
            margin-bottom: 30px;
            display: none;
        }
        
        .question.active {
            display: block;
            animation: fadeIn 0.6s ease;
        }
        
        .question h3 {
            color: var(--secondary);
            margin-bottom: 25px;
            font-size: 1.4rem;
            position: relative;
            padding-right: 15px;
        }
        
        .question h3::after {
            content: '';
            position: absolute;
            right: 0;
            bottom: -10px;
            width: 50px;
            height: 3px;
            background: linear-gradient(to right, var(--primary), transparent);
        }
        
        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        
        .option {
            background-color: var(--light);
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        
        .option:hover {
            border-color: var(--accent);
            transform: translateX(5px);
        }
        
        .option.selected {
            background-color: #e6f7ff;
            border-color: var(--primary);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.2);
        }
        
        .option.selected::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background-color: var(--primary);
        }
        
        .option-icon {
            margin-left: 10px;
            font-size: 1.2rem;
        }
        
        /* تصميم أزرار التحكم */
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }
        
        .btn {
            background: linear-gradient(to right, var(--primary), var(--accent));
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 120px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 20px rgba(67, 97, 238, 0.4);
        }
        
        .btn:disabled {
            background: #adb5bd;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .btn-prev {
            background: linear-gradient(to right, #6c757d, #adb5bd);
        }
        
        .btn-next {
            background: linear-gradient(to right, var(--accent), var(--primary));
        }
        
        .btn-finish {
            background: linear-gradient(to right, #4cc9f0, #4895ef);
        }
        
        .btn-restart {
            background: linear-gradient(to right, #f72585, #b5179e);
        }
        
        .btn-share {
            background: linear-gradient(to right, #2ec4b6, #06d6a0);
        }
        
        /* تصميم صفحة النتيجة */
        .result {
            display: none;
            text-align: center;
            animation: fadeIn 1s ease;
        }
        
        .result-card {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }
        
        .result-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(to right, var(--primary), var(--success));
        }
        
        .result h2 {
            color: var(--secondary);
            margin-bottom: 20px;
            font-size: 2rem;
        }
        
        .role {
            font-size: 1.8rem;
            color: var(--primary);
            font-weight: bold;
            margin: 20px 0;
            position: relative;
            display: inline-block;
        }
        
        .role::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(to right, var(--primary), transparent);
        }
        
        .emoji {
            font-size: 4rem;
            margin: 20px 0;
            display: inline-block;
            animation: bounce 2s infinite;
        }
        
        .description {
            margin-bottom: 30px;
            line-height: 1.8;
            font-size: 1.1rem;
            color: #495057;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .stat-item {
            background-color: var(--light);
            border-radius: 10px;
            padding: 15px;
            min-width: 120px;
            margin: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #6c757d;
        }
        
        .result-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        /* الرسوم المتحركة */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        /* التكيف مع الشاشات الصغيرة */

@media (max-width: 360px) {

    }
    
    .emoji {
        font-size: 3rem;
    }
    
    .stat-item {
        min-width: 100px;
        padding: 10px;
    }
}
    </style>
</head>

// استبدل دالة renderQuestion بهذا الكود:
function renderQuestion() {
    quizContainer.innerHTML = '';
    
    const questionDiv = document.createElement('div');
    questionDiv.className = 'question active'; // تأكد من إضافة كلاس active هنا
    
    const question = questions[currentQuestion];
    
    const questionTitle = document.createElement('h3');
    questionTitle.textContent = `سؤال ${currentQuestion + 1}: ${question.question}`;
    questionDiv.appendChild(questionTitle);
    
    const optionsDiv = document.createElement('div');
    optionsDiv.className = 'options';
    
    question.options.forEach((option, index) => {
        const optionDiv = document.createElement('div');
        optionDiv.className = `option ${answers[currentQuestion] === index ? 'selected' : ''}`;
        optionDiv.textContent = option.text;
        optionDiv.dataset.index = index;
        
        optionDiv.addEventListener('click', () => {
            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('selected');
            });
            optionDiv.classList.add('selected');
            answers[currentQuestion] = index;
        });
        
        optionsDiv.appendChild(optionDiv);
    });
    
    questionDiv.appendChild(optionsDiv);
    quizContainer.appendChild(questionDiv);
    
    // أضف هذه السطر لتفعيل تأثير الظهور
    questionDiv.style.animation = 'fadeIn 0.6s';
}
function initQuiz() {
    renderQuestion();
    updateButtons();
    updateProgressBar();

    // أضف مستمع الأحداث هنا فقط (بدون تكرار)
    nextBtn.addEventListener('click', () => {

            alert('الرجاء اختيار إجابة للمتابعة');
            return;
        }
        
        if (currentQuestion < questions.length - 1) {
            currentQuestion++;
            renderQuestion();
            updateButtons();
            updateProgressBar();
            quizContainer.scrollIntoView({ behavior: 'smooth' });
        } else {
            showResult();
        }
    });

    prevBtn.addEventListener('click', () => {
        if (currentQuestion > 0) {
            currentQuestion--;
            renderQuestion();
            updateButtons();
            updateProgressBar();
        }
    });
}

                designer: 0,
                leader: 0
            };
            
            // حساب النقاط بناء على الإجابات
            answers.forEach((answerIndex, questionIndex) => {
                if (answerIndex !== undefined) {
                    const option = questions[questionIndex].options[answerIndex];
                    for (const role in option.scores) {
                        scores[role] += option.scores[role];
                    }
                }
            });
            
            // تحديد الدور الأعلى نقاطاً
            let maxScore = 0;
            let userRole = 'frontend';
            
            for (const role in scores) {
                if (scores[role] > maxScore) {
                    maxScore = scores[role];
                    userRole = role;
                }
            }
            
            return userRole;
        }

        // عرض النتيجة
        function showResult() {
            const role = calculateResult();
            const roleInfo = roles[role];
            
            // حساب النسب المئوية
            const total = Object.values(scores).reduce((a, b) => a + b, 0);
            const percentages = {};
            for (const r in scores) {
                percentages[r] = Math.round((scores[r] / total) * 100);
            }
            
            quizContainer.style.display = 'none';
            prevBtn.style.display = 'none';
            nextBtn.style.display = 'none';
            
            resultDiv.innerHTML = `
                <div class="result-card">
                    <h2>نتيجتك النهائية!</h2>
                    <div class="emoji">${roleInfo.emoji}</div>
                    <div class="role">${roleInfo.title}</div>
                    
                    <div class="description">
                        ${roleInfo.description}
                    </div>
                    
                    <div class="stats">
                        <div class="stat-item">
                            <div class="stat-value">${percentages.frontend}%</div>
                            <div class="stat-label">Frontend</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${percentages.backend}%</div>
                            <div class="stat-label">Backend</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${percentages.designer}%</div>
                            <div class="stat-label">Designer</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${percentages.leader}%</div>
                            <div class="stat-label">Leader</div>
                        </div>
                    </div>
                    
                    <div class="result-buttons">
                        <button onclick="restartQuiz()" class="btn btn-restart">
                            <span class="option-icon">🔄</span> إعادة الاختبار
                        </button>
                        <button onclick="shareResult()" class="btn btn-share">
                            <span class="option-icon">📤</span> مشاركة النتيجة
                        </button>
                    </div>
                </div>
            `;
            
            resultDiv.style.display = 'block';
            
            // تأثير عند ظهور النتيجة
            const emoji = document.querySelector('.emoji');
            emoji.style.animation = 'bounce 2s infinite';
        }

        // إعادة تشغيل الاختبار
        function restartQuiz() {
            currentQuestion = 0;
            answers = [];
            scores = {
                frontend: 0,
                backend: 0,
                designer: 0,
                leader: 0
            };
            
            quizContainer.style.display = 'block';
            prevBtn.style.display = 'block';
            nextBtn.style.display = 'block';
            resultDiv.style.display = 'none';
            
            renderQuestion();
            updateButtons();
            updateProgressBar();
            
            // تأثير عند إعادة التشغيل
            quizContainer.style.animation = 'fadeIn 0.6s';
        }

        // مشاركة النتيجة
        function shareResult() {
            const role = calculateResult();
            const roleInfo = roles[role];
            
            const shareText = `نتيجتي في اختبار "من أنت في فريق التطوير؟" هي: ${roleInfo.title} ${roleInfo.emoji}\n\n${roleInfo.description}\n\nجرب الاختبار بنفسك: ${window.location.href}`;
            
            if (navigator.share) {
                navigator.share({
                    title: 'اكتشف دورك في فريق التطوير!',
                    text: shareText,
                    url: window.location.href
                }).catch(() => {
                    copyToClipboard(shareText);
                });
            } else {
                copyToClipboard(shareText);
                alert('تم نسخ النتيجة إلى الحافظة! يمكنك مشاركتها الآن.');
            }
        }

        // نسخ النص إلى الحافظة
        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
        }

        // أحداث الأزرار
        prevBtn.addEventListener('click', () => {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
                updateButtons();
                updateProgressBar();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (answers[currentQuestion] === undefined) {
                alert('الرجاء اختيار إجابة للمتابعة');
                return;
            }
            
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
                updateButtons();
                updateProgressBar();
            } else {
                showResult();
            }
        });

        // بدء الاختبار
        initQuiz();
        
        // جعل الدوال متاحة عالمياً لاستخدامها في الأزرار
        window.restartQuiz = restartQuiz;
        window.shareResult = shareResult;
    </script>
</body>
</html>
